# GitLab CI — e2e Playwright (порт с gitlab/upd, адаптирован под наш проект 13-Jun-2026).
# Прогон по расписанию (Schedule) / при пуше в дефолтную ветку / вручную из UI.
# Отчёт в Slack — через utils/PerFileSlackReporter.ts (подключён в playwright.config.ts).
#
# ⚠️ SLACK_WEBHOOK_URL задаётся ТОЛЬКО как CI/CD-переменная (Settings → CI/CD → Variables),
#    НИКОГДА не хардкодим вебхук в коде/конфиге (это секрет).
stages:
  - test

variables:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
  SLACK_WEBHOOK_URL: $SLACK_WEBHOOK_URL

run_e2e_tests:
  stage: test
  # Версия образа = версия @playwright/test в package.json (^1.60.0).
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  script:
    - npm ci
    # Подстраховка, если версия образа разойдётся с установленной версией Playwright:
    - npx playwright install --with-deps chromium
    - npx playwright test
  after_script:
    - echo "Tests finished. Результаты уходят в Slack через Playwright-репортер."
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - test-logs/
    expire_in: 30 days
  rules:
    # Прогон по расписанию (Schedule в GitLab)
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Прогон при пуше в дефолтную ветку
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Ручной запуск из интерфейса GitLab
    - if: $CI_PIPELINE_SOURCE == "web"

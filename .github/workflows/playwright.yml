name: Playwright Tests
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # Основной CI — GitLab (.gitlab-ci.yml: по расписанию + push в дефолтную ветку).
      # Этот workflow вторичный и ручной (workflow_dispatch). Гоняем ТОЛЬКО проект
      # storefront — он не мутирует живой VPS / игровой сервер. Проекты vps-panel и
      # game-panel исключены намеренно: они стейтфул и работают по общему прод-аккаунту.
      # Для auth-воронок задать CLIENTAREA_EMAIL / CLIENTAREA_PASSWORD в GitHub Secrets.
      run: npx playwright test --project=storefront
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30